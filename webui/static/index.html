<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Patchx — Trung tâm vượt chặn</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>🧰 Patchx <span class="sub">Mod · Bypass · Hook APK</span></h1>
  <div id="env" class="env"><span class="dot idle"></span> đang kiểm tra môi trường…</div>
  <div id="modes" class="modes" title="Chế độ hiển thị">
    <button data-mode="basic">🟢 Cơ bản</button>
    <button data-mode="adv" class="on">🟡 Nâng cao</button>
    <button data-mode="exp">🔴 Chuyên gia</button>
  </div>
</header>

<nav id="statusbar" class="statusbar" aria-label="Tiến trình 6 tầng"></nav>

<main id="view">
  <!-- Các khu vực được vẽ bằng JS -->
</main>

<nav id="nav" class="nav">
  <button data-tab="home" class="on"><span class="ic">🏠</span><span>Trang chủ</span></button>
  <button data-tab="phan_tich"><span class="ic">🔍</span><span>Phân tích</span></button>
  <button data-tab="ke_hoach"><span class="ic">🗺️</span><span>Kế hoạch</span></button>
  <button data-tab="va_loi"><span class="ic">🛠️</span><span>Vá lỗi</span></button>
  <button data-tab="kiem_thu"><span class="ic">🧪</span><span>Kiểm thử</span></button>
  <button data-tab="bao_cao"><span class="ic">📊</span><span>Báo cáo</span></button>
  <button data-tab="he_thong"><span class="ic">⚙️</span><span>Hệ thống</span></button>
</nav>

<footer class="foot">Patchx Toolkit — toàn bộ lệnh, một giao diện, tiếng Việt.</footer>

<script src="/static/app.js"></script>
</body>
</html>
